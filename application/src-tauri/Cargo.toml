[package]
name = "quibble-desktop"
version = "0.1.0"
description = "Quibble – A Libre P2P Chat Desktop Application"
authors = []
edition = "2021"

[lib]
name = "quibble_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
